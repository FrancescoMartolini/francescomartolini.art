name: Notifica nuovi contenuti

# ─────────────────────────────────────────────
# FUNZIONALITÀ IN PAUSA.
# Prima si attivava da sola a ogni push che toccava json/progetti.json
# o json/taccuino.json. Per ora è disattivata: parte SOLO se lanciata
# a mano dalla tab "Actions" del repo (pulsante "Run workflow").
#
# Per riattivarla come prima, sostituisci il blocco "on:" qui sotto con:
#
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'json/progetti.json'
#       - 'json/taccuino.json'
# ─────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recupera le versioni precedenti dei JSON
        run: |
          git show "${{ github.event.before }}:json/progetti.json" > /tmp/vecchio-progetti.json 2>/dev/null || echo "" > /tmp/vecchio-progetti.json
          git show "${{ github.event.before }}:json/taccuino.json" > /tmp/vecchio-taccuino.json 2>/dev/null || echo "" > /tmp/vecchio-taccuino.json

      - name: Invia notifiche per i nuovi progetti
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          python3 scripts/notifica-nuovi-contenuti.py progetti json/progetti.json /tmp/vecchio-progetti.json > /tmp/notifiche-progetti.txt
          while IFS= read -r payload; do
            [ -z "$payload" ] && continue
            echo "Invio notifica progetto: $payload"
            codice=$(curl -s -o /tmp/risposta.txt -w "%{http_code}" -X POST "https://francescomartolini.art/notify" \
              -H "Content-Type: application/json" \
              -H "x-notify-secret: $NOTIFY_SECRET" \
              -d "$payload")
            echo "Codice HTTP: $codice"
            echo "Risposta: $(cat /tmp/risposta.txt)"
            if [ "$codice" -lt 200 ] || [ "$codice" -ge 300 ]; then
              echo "::error::/notify ha risposto $codice"
              exit 1
            fi
          done < /tmp/notifiche-progetti.txt

      - name: Invia notifiche per le nuove voci del Taccuino
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          python3 scripts/notifica-nuovi-contenuti.py taccuino json/taccuino.json /tmp/vecchio-taccuino.json > /tmp/notifiche-taccuino.txt
          while IFS= read -r payload; do
            [ -z "$payload" ] && continue
            echo "Invio notifica taccuino: $payload"
            codice=$(curl -s -o /tmp/risposta.txt -w "%{http_code}" -X POST "https://francescomartolini.art/notify" \
              -H "Content-Type: application/json" \
              -H "x-notify-secret: $NOTIFY_SECRET" \
              -d "$payload")
            echo "Codice HTTP: $codice"
            echo "Risposta: $(cat /tmp/risposta.txt)"
            if [ "$codice" -lt 200 ] || [ "$codice" -ge 300 ]; then
              echo "::error::/notify ha risposto $codice"
              exit 1
            fi
          done < /tmp/notifiche-taccuino.txt
