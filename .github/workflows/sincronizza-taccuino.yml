# Tiene json/taccuino.json allineato ai fogli Google Sheets (IT/EN)
# pubblicati, così il sito può sempre leggere il Taccuino da un file
# locale veloce invece che dal foglio "live" ad ogni visita (vedi
# scripts/sincronizza-taccuino.py e SHEETS_TIMEOUT_MS in js/libro.js).
name: Sincronizza Taccuino da Google Sheets

on:
  schedule:
    # Ogni giorno alle 6:00 UTC. Se scrivi una voce e vuoi vederla subito
    # sul sito senza aspettare, usa "Run workflow" qui sotto.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizza:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizza taccuino.json
        run: python3 scripts/sincronizza-taccuino.py

      - name: Commit se ci sono modifiche
        run: |
          if git diff --quiet -- json/taccuino.json; then
            echo "Nessuna modifica al Taccuino."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/taccuino.json
          git commit -m "Sincronizza taccuino.json da Google Sheets [automatico]"

          # Se nel frattempo main è avanzato (es. un commit manuale quasi
          # in contemporanea), ci riallineiamo con un rebase prima di
          # pushare, riprovando qualche volta invece di fallire subito.
          tentativi=0
          finche_max=5
          until git push; do
            tentativi=$((tentativi + 1))
            if [ "$tentativi" -ge "$finche_max" ]; then
              echo "::error::Push fallito dopo $tentativi tentativi."
              exit 1
            fi
            echo "Push rifiutato (remoto avanzato), riprovo con un rebase... (tentativo $tentativi)"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done

      # Notifica l'esito su Telegram, sia in caso di successo che di errore,
      # così non serve controllare a mano la tab "Actions" del repo.
      # Richiede due secrets nel repo (Settings → Secrets and variables →
      # Actions): TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID.
      - name: Notifica Telegram (successo)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: 8961104236:AAGK9ndDrVs9tvmPYAbFRKv7sQ2bo5vMS88
          TELEGRAM_CHAT_ID: 148877314
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ Taccuino sincronizzato correttamente ($(date -u +'%Y-%m-%d %H:%M UTC'))." \
            > /dev/null

      - name: Notifica Telegram (errore)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: 8961104236:AAGK9ndDrVs9tvmPYAbFRKv7sQ2bo5vMS88
          TELEGRAM_CHAT_ID: 148877314
        run: |
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ Sincronizzazione Taccuino fallita ($(date -u +'%Y-%m-%d %H:%M UTC')). Log: ${LOG_URL}" \
            > /dev/null
